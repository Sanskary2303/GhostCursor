name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python Lint & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/orchestrator/requirements.txt
          pip install -e packages/sdk-server-python[dev]
          pip install -r demo/shophive/backend/requirements.txt

      - name: Run pytest
        env:
          PYTHONPATH: ".:packages/sdk-server-python:demo/shophive/backend"
        run: |
          pytest tests/ services/orchestrator/tests packages/sdk-server-python

  node:
    name: Node Typecheck, Lint & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install npm dependencies
        run: npm ci

      - name: Typecheck all workspaces
        run: npm run typecheck:all

      - name: Lint all workspaces
        run: npm run lint:all

      - name: Run unit tests
        run: npm run test:all

      - name: Build all workspaces
        run: npm run build:all

  e2e:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    needs: [python, node]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install npm dependencies
        run: npm ci

      - name: Set up Python virtual environment
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r services/orchestrator/requirements.txt
          .venv/bin/pip install -e packages/sdk-server-python[dev]
          .venv/bin/pip install -r demo/shophive/backend/requirements.txt

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e

