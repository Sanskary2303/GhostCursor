[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ghost-cursor"
version = "0.1.0"
description = "Ghost Cursor Python Backend SDK - Secure gateway proxy for Ghost Cursor Cloud"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Ghost Cursor Team", email = "team@ghostcursor.ai"}
]
keywords = ["ghost-cursor", "ai-assistant", "sdk", "backend", "proxy", "google-adk"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
]
dependencies = [
    "fastapi>=0.109.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.1.0",
    "httpx>=0.26.0",
    "sqlalchemy>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
fastapi = ["fastapi>=0.109.0"]
flask = ["flask>=3.0.0"]
django = ["django>=5.0.0"]
asyncpg = ["asyncpg>=0.29.0"]
psycopg = ["psycopg[binary]>=3.1.0"]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
    "black>=24.0.0",
]

[project.urls]
Homepage = "https://github.com/ghost-cursor/ghost-cursor"
Repository = "https://github.com/ghost-cursor/ghost-cursor"
Documentation = "https://docs.ghostcursor.ai"
Issues = "https://github.com/ghost-cursor/ghost-cursor/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["ghost_cursor*"]

[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py312"
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "PT", "SIM", "T20", "ARG"]
ignore = ["E501", "ARG001", "ARG002"]
fixable = ["E", "F", "I", "N", "W", "UP", "B", "C4", "PT", "SIM", "T20"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
pretty = true

[tool.black]
line-length = 100
target-version = ['py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  \.git
  | \.venv
  | venv
  | build
  | dist
)/
'''